---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  annotations:
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_headers "Server";
      more_set_headers "X-Content-Type-Options: nosniff";
spec:
  tls:
    - hosts:
      - {{ domain }}
      secretName: tls
  ingressClassName: nginx
  rules:
    - host: {{ domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ service }}
                port:
                  number: {{ port }}
